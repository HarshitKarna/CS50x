<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="/static/styles.css" rel="stylesheet">
        <title>Birthdays</title>
    </head>
    <body>
        <div class="header">
            <h1>Birthdays</h1>
        </div>
        <div class="container">
            <div class="section">

                <h2>Add a Birthday</h2>
                <form action="/" method="POST">
                    <input type="text" name="name" id="person_name" placeholder="Name">
                    <input type="number" name="month" id="bday_month" placeholder="Month">
                    <input type="number" name="day" id="bday_day" placeholder="Day">
                    <button type="submit">Add Birthday</button>
                </form>
            </div>

            <div class="section">

                <h2>All Birthdays</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birthday</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for person in people %}
                        <tr>
                            <td>{{ person["name"] }}</td>
                            <td>{{ person["month"] }}/{{ person["day"] }}</td>
                            <td>
                                <form action="/delete" method="POST">
                                    <input type="hidden" name="id" value="{{ person['id'] }}">
                                    <button type="submit" onclick="return confirm('Are you sure you wanna delete this entry?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
