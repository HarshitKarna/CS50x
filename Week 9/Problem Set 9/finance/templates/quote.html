{% extends "layout.html" %}

{% block title %}
    Quote
{% endblock %}

{% block main %}
    {% if quote %}
        <h2 class="mb-3">Quote</h2>
        <table class="table table-striped table-bordered w-auto mx-auto">
            <tbody>
                <tr><th>Company</th><td>{{ quote["name"] }}</td></tr>
                <tr><th>Symbol</th><td>{{ quote["symbol"] }}</td></tr>
                <tr><th>Price</th><td>{{ quote["price"] | usd }}</td></tr>
            </tbody>
        </table>
        <p class="mt-3"><a href="/buy">Buy shares</a></p>
    {% else %}
        <form action="/quote" method="post">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Ticker Symbol" type="text">
            </div>
            <button class="btn btn-primary" type="submit">Get Quote</button>
        </form>
    {% endif %}
{% endblock %}
