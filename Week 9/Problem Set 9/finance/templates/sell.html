{% extends "layout.html" %}

{% block title %}
    Sell Shares
{% endblock %}

{% block main %}
    {% if positions %}
        <form action="/sell" method="post">
            <div class="mb-3">
                <select class="form-select mx-auto w-auto" name="symbol">
                    {% for position in positions %}
                        <option value="{{ position['symbol'] }}">{{ position['symbol'] }} ({{ position['total_shares'] }} shares)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <input class="form-control mx-auto w-auto" min="1" name="shares" placeholder="Shares" type="number">
            </div>
            <button class="btn btn-primary" type="submit">Sell</button>
        </form>
    {% else %}
        <p>You do not own any shares to sell.</p>
    {% endif %}
{% endblock %}
